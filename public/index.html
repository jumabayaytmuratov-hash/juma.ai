<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dars ishlanma — AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#14211c;--mu:#5b6b64;--ac:#1f6b52;--am:#d99a00;--bd:#d8e0dc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#17221d;--tx:#e8f0ec;--mu:#98aaa2;--ac:#4fb38d;--am:#f0b429;--bd:#27372f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Onest,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:24px;margin:8px 0 4px;letter-spacing:-.01em}
a.gear{font-size:20px;text-decoration:none;padding:6px 10px;border:1px solid var(--bd);border-radius:10px}
.s{color:var(--mu);font-size:14px;margin:0 0 12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
button,a.btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:600 16px Onest,system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-top:8px}
button:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>div{flex:1}
.b{display:inline-block;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--mu);margin:0 4px 10px 0}
.b.p{color:var(--am);border-color:var(--am);font-weight:600;cursor:pointer}
.hide{display:none}
#out{white-space:pre-wrap;overflow-wrap:anywhere}
#out img{width:100%;border:1px solid var(--bd);border-radius:8px;background:#fff}
.err{color:#c0392b;font-weight:600;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="w">
<header><h1>📘 Dars ishlanma</h1><a class="gear" href="/admin.html" aria-label="Admin">⚙️</a></header>
<p class="s">Fan, sinf va mavzuni kiriting — 5E modeli asosida, texnologik xaritali tayyor dars ishlanma oling. Word (.docx) yuklab olish pullik.</p>
<span class="b" id="left"></span><span class="b p" id="prem">⭐ Yillik Premium</span>

<div class="c">
<label>Fan</label><input id="fan" value="Texnologiya">
<div class="row">
<div><label>Sinf</label><select id="sinf"></select></div>
<div><label>Vaqt (daqiqa)</label><input id="vaqt" type="number" value="45" min="20" max="90"></div>
</div>
<label>Dars ishlanma tili</label><select id="til"><option value="uz">O'zbekcha (lotin)</option><option value="uzc">Ўзбекча (кирилл)</option><option value="kaa">Qaraqalpaqsha (lotin)</option><option value="ru">Русский</option></select>
<label>Dars mavzusi</label><input id="mavzu" placeholder="Masalan: Elektr zanjiri">
<button id="go">Dars ishlanma yaratish</button>
<div class="err" id="gmsg"></div>
</div>

<div class="c hide" id="res">
<div id="out"></div>
<div class="err" id="msg"></div>
<button id="dl" class="g">⬇️ Word (.docx) yuklab olish</button>
<button id="cp" class="g hide">📋 Nusxa olish</button>
</div>

<div class="c hide" id="pay">
<b>💳 Word yuklash uchun to'lov</b>
<label>Tarif</label><select id="plan"></select>
<p class="s" id="cardline" style="margin-top:8px"></p>
<a class="btn" id="tg" target="_blank" rel="noopener">📤 Chekni yuborish</a>
<label>Faollashtirish kodi</label><input id="code" placeholder="Kodni kiriting" autocapitalize="characters">
<button id="act" class="g">Faollashtirish</button>
<div class="err" id="pmsg"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const dev=(()=>{let d=localStorage.getItem('dev');if(!d){d=crypto.randomUUID();localStorage.setItem('dev',d);}return d;})();
const m=n=>(+n).toLocaleString('ru-RU')+" so'm";
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CFG={lesson:0,year:0,tg:'',card:''},ME={left:0,premium:false},last='',IMG=[],SVG=[];
for(let i=1;i<=11;i++)$('sinf').add(new Option(i+'-sinf',i,false,i===8));
$('til').value=localStorage.getItem('til')||'uz';$('til').onchange=()=>localStorage.setItem('til',$('til').value);
const LBLS={uz:'Rasm',uzc:'Расм',kaa:'Sýwret',ru:'Рисунок'},LBL=()=>LBLS[$('til').value]||'Rasm';

async function load(){
  try{CFG=await (await fetch('/api/config')).json();ME=await (await fetch('/api/me?d='+dev)).json();}catch(e){}
  refresh();
}
function refresh(){
  $('left').textContent=ME.premium?'⭐ Premium: '+new Date(ME.until).toLocaleDateString('ru-RU')+' gacha':'Word yuklash qoldi: '+ME.left;
  $('cp').classList.toggle('hide',!ME.premium);
  const keep=$('plan').selectedIndex<0?1:$('plan').selectedIndex;
  $('plan').innerHTML='';
  $('plan').add(new Option("Bir marta Word yuklash — "+m(CFG.lesson)));
  $('plan').add(new Option("⭐ Yillik Premium — "+m(CFG.year)+" (cheklovsiz)"));
  $('plan').selectedIndex=keep;
  $('cardline').innerHTML='<b>To\'lov summasi:</b><br>• Bir marta Word yuklash: <b>'+m(CFG.lesson)+'</b><br>• ⭐ Yillik Premium: <b>'+m(CFG.year)+'</b><br><br>'+(CFG.card?'Karta: <b>'+esc(CFG.card)+'</b><br>':'')+'1) Tarifni tanlab, Payme / Click orqali to\'lang.<br>2) Chekni Telegramga yuboring: <a href="https://t.me/'+CFG.tg+'" target="_blank" style="color:var(--ac);font-weight:600">@'+CFG.tg+'</a><br>3) Olingan kodni pastga kiriting.';
  updTg();
}
function updTg(){
  $('tg').textContent='📤 Chekni @'+CFG.tg+"'ga yuborish";
  $('tg').href='https://t.me/'+CFG.tg+'?text='+encodeURIComponent("Salom! Dars ishlanmani Word formatda yuklash uchun to'lov qildim.\nTarif: "+$('plan').value+"\nChekni yuboraman.");
}
$('plan').onchange=updTg;
$('prem').onclick=()=>{$('pay').classList.remove('hide');$('plan').selectedIndex=1;updTg();$('pay').scrollIntoView({behavior:'smooth',block:'center'});};

function svgToUrl(src){
  try{
    const d=new DOMParser().parseFromString(src,'image/svg+xml'),sv=d.documentElement;
    if(sv.nodeName!=='svg'||d.querySelector('parsererror'))return null;
    sv.querySelectorAll('script,foreignObject,image,iframe').forEach(e=>e.remove());
    sv.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||/href/i.test(a.name))e.removeAttribute(a.name);}));
    sv.setAttribute('xmlns','http://www.w3.org/2000/svg');
    if(!sv.getAttribute('viewBox'))sv.setAttribute('viewBox','0 0 600 400');
    sv.setAttribute('width','600');sv.setAttribute('height','400');
    return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(sv));
  }catch(e){return null;}
}
function renderOut(){
  const o=$('out');o.textContent='';
  const parts=last.split(/\n?\[RASM\s*(\d)\s*:?\s*([^\]]*)\]\n?/);
  for(let i=0;i<parts.length;i+=3){
    if(parts[i]){const d=document.createElement('div');d.textContent=parts[i];o.appendChild(d);}
    if(i+1<parts.length){
      const n=+parts[i+1],f=document.createElement('figure');f.style.margin='12px 0';
      if(IMG[n]){const im=document.createElement('img');im.src=IMG[n];f.appendChild(im);}
      const c=document.createElement('figcaption');c.className='s';c.textContent=LBL()+' '+n+(parts[i+2]?': '+parts[i+2].trim():'');f.appendChild(c);
      o.appendChild(f);
    }
  }
}
function toPng(u){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=800;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1200,800);x.drawImage(im,0,0,1200,800);res(c.toDataURL('image/png'));};im.onerror=()=>res(null);im.src=u;});}
const post=(p,b)=>fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({d:dev,...b})});

$('go').onclick=async()=>{
  const t=$('mavzu').value.trim();$('gmsg').textContent='';
  if(!t){$('gmsg').textContent='Mavzuni kiriting';return;}
  $('go').disabled=true;$('go').textContent='Yaratilmoqda…';
  $('res').classList.remove('hide');$('out').textContent='';$('msg').textContent='';last='';IMG=[];
  try{
    const r=await post('/api/generate',{lang:$('til').value,topic:t,fan:$('fan').value,sinf:$('sinf').value,vaqt:$('vaqt').value});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'Xatolik '+r.status);}
    const rd=r.body.getReader(),dec=new TextDecoder();
    for(;;){const {done,value}=await rd.read();if(done)break;last+=dec.decode(value,{stream:true});$('out').textContent=last;}
    renderOut();
    const caps=[...last.matchAll(/\[RASM\s*(\d)\s*:?\s*([^\]]*)\]/g)];
    if(caps.length){
      $('go').textContent='Rasmlar chizilmoqda…';
      try{
        const ri=await post('/api/images',{lang:$('til').value,topic:t,captions:caps.map(c=>c[2])});
        const {svgs=[]}=await ri.json();
        caps.forEach((c,k)=>{const u=svgs[k]&&svgToUrl(svgs[k]);if(u)IMG[+c[1]]=u;});
        renderOut();
      }catch(e){}
    }
  }catch(e){$('out').textContent='';$('msg').textContent=e.message||'Qayta urinib ko\'ring';if(!last)$('res').classList.add('hide');$('gmsg').textContent=e.message||'';}
  $('go').disabled=false;$('go').textContent='Dars ishlanma yaratish';
};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(last.replace(/\n?\[RASM[^\]]*\]/g,''));$('cp').textContent='✅ Nusxa olindi';}catch(e){}};

$('dl').onclick=async()=>{
  if(!last){$('msg').textContent='Avval dars ishlanma yarating';return;}
  $('msg').textContent='Fayl tayyorlanmoqda…';
  try{
    const images={};
    for(const n of [1,2,3])if(IMG[n]){const p=await toPng(IMG[n]);if(p)images[n]=p;}
    const r=await post('/api/download',{lang:$('til').value,text:last,images});
    if(r.status===402){$('msg').textContent="Word yuklash pullik — to'lovni amalga oshiring";$('pay').classList.remove('hide');$('pay').scrollIntoView({behavior:'smooth',block:'center'});return;}
    if(!r.ok)throw new Error('Xatolik '+r.status);
    const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');
    a.href=u;a.download='dars-ishlanma.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
    $('msg').textContent='';$('dl').textContent='✅ Yuklandi';
    ME=await (await fetch('/api/me?d='+dev)).json();refresh();
  }catch(e){$('msg').textContent='Yuklash xatoligi: '+(e.message||'nomaʼlum');}
};
$('act').onclick=async()=>{
  const r=await post('/api/redeem',{code:$('code').value});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$('pmsg').textContent=j.error||'Xatolik';return;}
  $('pmsg').textContent='✅ Faollashtirildi';$('code').value='';
  ME=await (await fetch('/api/me?d='+dev)).json();refresh();
  setTimeout(()=>{$('pay').classList.add('hide');$('pmsg').textContent='';},1200);
};
load();
</script>
</body>
</html>
